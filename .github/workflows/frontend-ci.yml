name: Frontend CI

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # No frontend/.env in CI; the build requires the API URL and proxy target (src/lib/config.ts, next.config.ts).
  NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
  API_PROXY_TARGET: http://localhost:8000

jobs:
  check:
    name: Typecheck, format, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Uses the pnpm version pinned in "packageManager".
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # same as frontend/Dockerfile
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Format check
        run: pnpm format:check

      - name: Unit and component tests
        run: pnpm test

      - name: Production build
        run: pnpm build
