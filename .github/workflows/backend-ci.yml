name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: backend

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # Same image as docker-compose.yml: Postgres with the pgvector extension (ADR-0006).
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcp_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Override .env (copied from .env.example below); environment variables take precedence in pydantic-settings.
      ENVIRONMENT: test
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mcp_hub
      # The suite deletes every row in this database, so it is a separate one (tests/conftest.py).
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/mcp_hub_test
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: backend/pyproject.toml

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[dev]"

      - name: Configure settings
        # Every setting is required with no in-code default; starting from .env.example makes CI fail
        # when a new setting is added to the app but not documented there.
        run: |
          cp .env.example .env
          # .env.example holds a placeholder; generate a throwaway Fernet key for this run.
          echo "OAUTH_ENCRYPTION_KEY=$(uv run python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Create test database
        run: createdb mcp_hub_test

      - name: Apply migrations
        # Checks that the Alembic history applies cleanly to an empty database.
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest -v
