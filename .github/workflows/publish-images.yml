name: Publish images

# Builds the backend and frontend images and pushes them to GitHub Container Registry (GHCR):
#   ghcr.io/<owner>/mcp-hub-backend and ghcr.io/<owner>/mcp-hub-frontend
# tagged `latest` (newest main) and `sha-<short commit>` (immutable, for deploys and rollbacks).
on:
  push:
    branches: [main] # merging a PR is a push to main
  workflow_dispatch: # run by hand from the Actions tab

concurrency:
  group: publish-images
  cancel-in-progress: false # never cancel a half-pushed image

permissions:
  contents: read
  packages: write # lets GITHUB_TOKEN push to ghcr.io

jobs:
  publish:
    name: Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: backend
            context: backend
          - image: frontend
            context: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/mcp-hub-${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # NEXT_PUBLIC_* is inlined into the browser bundle at build time (frontend/Dockerfile), so the frontend
          # image only talks to this API URL. Set it as the repository variable NEXT_PUBLIC_API_BASE_URL
          # (Settings -> Secrets and variables -> Actions -> Variables). The backend image ignores it.
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=${{ vars.NEXT_PUBLIC_API_BASE_URL }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
