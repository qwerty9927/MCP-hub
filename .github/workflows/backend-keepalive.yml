name: Backend keepalive

# Pings the backend's liveness probe every 10 minutes so its free-tier host doesn't sleep between visits.
# It lives here, not in Vercel: Vercel Cron Jobs run at most once a day on the Hobby plan.
# Needs the repository variable KEEPALIVE_URL (Settings > Secrets and variables > Actions > Variables), the full health
# URL, e.g. https://<console>/api/v1/system/health (through the console's /api/v1 rewrite) or the backend's own.
# GitHub runs schedules only from the default branch, may start them a few minutes late, and turns them off after
# 60 days without repository activity (re-enable from the Actions tab).

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: backend-keepalive
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ping:
    name: Ping backend health
    # Forks and clones without the variable skip instead of failing.
    if: vars.KEEPALIVE_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: GET health
        env:
          KEEPALIVE_URL: ${{ vars.KEEPALIVE_URL }}
        # A cold start can take close to a minute: allow 90s per try and retry. A non-2xx status fails the run.
        run: curl -fsS --max-time 90 --retry 3 --retry-delay 10 --retry-all-errors "$KEEPALIVE_URL"
