services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mcp-hub-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///data/mcp_hub.db
    volumes:
      - sqlite_data:/app/data

volumes:
  sqlite_data:
